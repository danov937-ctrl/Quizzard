<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Quizzard · Нова парола</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="extras.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="qx-page">
    <a href="/" class="qx-back-link">← Към играта</a>
    <article class="qx-paper" id="out" style="max-width:440px"><p>Зареждане…</p></article>
  </main>
  <script>
  (() => {
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const out = document.getElementById('out');
    const token = location.hash.slice(1);
    const url = '/api/reset/' + encodeURIComponent(token);
    if (!token) { out.innerHTML = '<h1>Нова парола</h1><p>Отворете линка от писмото.</p>'; return; }
    fetch(url).then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error); return d; }).then((d) => {
      out.innerHTML = `<h1>🔑 Нова парола</h1><p>за профила <b>„${esc(d.name)}“</b></p>
        <form class="qx-form" id="f"><label>Нова парола<input type="password" name="p1" minlength="4" maxlength="64" autocomplete="new-password" required></label>
        <label>Още веднъж<input type="password" name="p2" minlength="4" maxlength="64" autocomplete="new-password" required></label>
        <p class="qx-err" id="err"></p><button class="qx-btn gold">Запази</button></form>`;
      document.getElementById('f').onsubmit = async (ev) => {
        ev.preventDefault();
        const f = ev.target, err = document.getElementById('err');
        if (f.p1.value !== f.p2.value) { err.textContent = 'Паролите не са еднакви.'; return; }
        const r = await fetch(url, { method: 'POST', headers: { 'X-Quizzard': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ password: f.p1.value }) });
        const res = await r.json();
        if (!r.ok) { err.textContent = res.error; return; }
        out.innerHTML = `<h1>✅ Готово</h1><p>Паролата е сменена и <b>${esc(d.name)}</b> вече е в профила си на това устройство.</p><p><a class="qx-btn gold" href="/">Към играта</a></p>`;
      };
    }).catch((e) => { out.innerHTML = `<h1>Нова парола</h1><p>${esc(e.message)}</p><p><a href="/">Към играта</a></p>`; });
  })();
  </script>
</body>
</html>
