services:
  - type: web
    name: quizzard
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      # Android приложение (Google Play): пакетът и отпечатъкът на ключа от Play Console
      - key: ANDROID_PACKAGE
        value: bg.quizzard.app
      - key: ANDROID_SHA256
        sync: false
